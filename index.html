<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFG-DRMC — Mods &amp; Addons</title>
<meta name="description" content="All of Drmc's Minecraft mods and addons: C'sT (Java & Bedrock), Drmc Additions, SCP: Restructured, OADM, Insomnia and PBS: Northstar.">
<style>
  :root{
    --bg:#08080c; --panel:#12121a; --panel2:#181824; --line:#26263a;
    --text:#e8e8f0; --muted:#8b8ba3; --accent:#ff3b3b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh; line-height:1.55; overflow-x:hidden;
  }
  /* background: glow + scanlines */
  body::before{
    content:"";position:fixed;inset:0;z-index:-2;
    background:
      radial-gradient(60% 50% at 20% 0%, color-mix(in srgb,var(--accent) 22%, transparent), transparent 70%),
      radial-gradient(50% 40% at 90% 20%, rgba(80,80,255,.12), transparent 70%),
      var(--bg);
    transition:background .5s;
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px);
  }
  a{color:inherit}
  button{font:inherit;color:inherit;cursor:pointer}

  header.top{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px clamp(16px,5vw,56px); position:sticky;top:0;z-index:10;
    background:linear-gradient(var(--bg),rgba(8,8,12,.6));backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .brand{font-weight:800;letter-spacing:.14em;font-size:.95rem;cursor:pointer;background:none;border:0}
  .brand span{color:var(--accent)}
  nav.links{display:flex;gap:18px;font-size:.9rem;color:var(--muted)}
  nav.links a{text-decoration:none}
  nav.links a:hover{color:var(--text)}

  main{max-width:1100px;margin:0 auto;padding:0 clamp(16px,5vw,32px) 80px}

  /* ===== HOME ===== */
  .hero{text-align:center;padding:clamp(48px,10vw,110px) 0 36px}
  .hero .kicker{color:var(--muted);letter-spacing:.35em;font-size:.75rem;text-transform:uppercase}
  .hero h1{
    font-size:clamp(2.4rem,8vw,5.2rem);line-height:1.02;margin:14px 0 16px;font-weight:900;letter-spacing:-.02em;
    background:linear-gradient(180deg,#fff,#9a9ab5);-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:flicker 7s infinite;
  }
  .hero h1 em{font-style:normal;background:none;color:var(--accent);-webkit-text-fill-color:var(--accent);text-shadow:0 0 28px var(--accent)}
  .hero p{max-width:560px;margin:0 auto;color:var(--muted);font-size:1.05rem}
  @keyframes flicker{0%,92%,100%{opacity:1}93%{opacity:.55}94%{opacity:1}96%{opacity:.7}97%{opacity:1}}

  .section-title{margin:48px 0 18px;font-size:.8rem;letter-spacing:.3em;color:var(--muted);text-transform:uppercase}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
  .card{
    position:relative;text-align:left;border:1px solid var(--line);border-radius:16px;
    background:linear-gradient(160deg,var(--panel2),var(--panel));padding:22px;overflow:hidden;
    transition:transform .2s,border-color .2s,box-shadow .2s;
  }
  .card::before{
    content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c);
    box-shadow:0 0 18px var(--c);
  }
  .card::after{
    content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;
    background:radial-gradient(var(--c),transparent 70%);opacity:.14;transition:opacity .2s;
  }
  .card:hover{transform:translateY(-4px);border-color:var(--c);box-shadow:0 12px 40px -14px var(--c)}
  .card:hover::after{opacity:.3}
  .card .tag{display:inline-block;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--c);border:1px solid var(--c);border-radius:99px;padding:2px 10px;margin-bottom:12px}
  .card h3{font-size:1.35rem;margin-bottom:6px}
  .card p{color:var(--muted);font-size:.95rem}
  .card .go{display:inline-block;margin-top:16px;font-size:.85rem;color:var(--c);font-weight:600}

  /* ===== PROJECT PAGE ===== */
  .back{margin:28px 0 8px;background:none;border:0;color:var(--muted);font-size:.9rem}
  .back:hover{color:var(--text)}
  .proj-head{padding:18px 0 8px;border-bottom:1px solid var(--line);margin-bottom:26px}
  .proj-head .tag{display:inline-block;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:2px 12px}
  .proj-head h2{font-size:clamp(2rem,6vw,3.4rem);margin:10px 0 6px;letter-spacing:-.02em}
  .proj-head p.lead{color:var(--muted);max-width:680px;font-size:1.05rem}

  .tabs{display:flex;gap:6px;margin:22px 0 24px;flex-wrap:wrap}
  .tab{padding:9px 18px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-weight:600;font-size:.92rem}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 22px -6px var(--accent)}

  .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px}
  .box h4{font-size:1.05rem;margin-bottom:10px}
  .box p,.box li{color:#c4c4d6}
  .box ul{padding-left:20px}
  .feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .feat div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}
  .feat b{display:block;margin-bottom:4px;color:var(--accent)}
  .feat span{font-size:.9rem;color:var(--muted)}

  .btns{display:flex;gap:10px;flex-wrap:wrap}
  .btn{display:inline-block;text-decoration:none;padding:11px 20px;border-radius:10px;font-weight:700;background:var(--accent);color:#fff;border:1px solid var(--accent);transition:filter .15s,transform .15s}
  .btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
  .btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}

  .shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .shots img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
  .ph{aspect-ratio:16/9;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:.85rem;background:var(--panel2)}

  /* ===== CRAFTING WIKI ===== */
  .wiki-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .wiki-tools input{
    flex:1;min-width:200px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font:inherit;
  }
  .wiki-tools input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:.85rem}
  .chip.on{border-color:var(--accent);color:var(--text);background:color-mix(in srgb,var(--accent) 18%,var(--panel))}

  .crafts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .craft{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  .craft h5{font-size:1.05rem;margin-bottom:2px}
  .craft small{color:var(--muted);display:block;margin-bottom:12px}
  .recipe{display:flex;align-items:center;gap:14px;margin-bottom:12px}
  .g3{display:grid;grid-template-columns:repeat(3,52px);grid-auto-rows:52px;gap:4px;padding:6px;background:#0c0c13;border:1px solid var(--line);border-radius:8px}
  .cell{display:grid;place-items:center;background:var(--panel2);border:1px solid #2e2e46;border-radius:6px;font-size:.62rem;text-align:center;line-height:1.1;padding:2px;color:#d6d6e6;overflow:hidden;word-break:break-word}
  .cell.e{opacity:.35}
  .arrow{font-size:1.4rem;color:var(--muted)}
  .res{width:60px;height:60px;border-color:var(--accent);box-shadow:0 0 16px -4px var(--accent);font-size:.68rem;font-weight:700;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--accent);border-radius:8px;text-align:center;padding:3px}
  .craft p{font-size:.88rem;color:var(--muted)}
  .empty{color:var(--muted);padding:30px;text-align:center;border:1px dashed var(--line);border-radius:12px}

  footer{border-top:1px solid var(--line);color:var(--muted);text-align:center;padding:28px 16px;font-size:.85rem}
  .view{display:none}.view.on{display:block;animation:in .35s ease}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (max-width:560px){nav.links{display:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <button class="brand" onclick="go('')">Novaic<span>-</span>DRMC</button>
  <nav class="links">
    <a href="#" onclick="go('');return false">Projects</a>
    <a href="https://github.com/NFG-DRMC" target="_blank" rel="noopener">GitHub</a>
  </nav>
</header>

<main>
  <!-- HOME -->
  <section id="home" class="view">
    <div class="hero">
      <div class="kicker">Minecraft Mods &amp; Addons</div>
      <h1>Pick your <em>project</em></h1>
      <p>Several universes, one place. Select a project to see its description, its downloads and, for C'sT, the crafting wiki.</p>
    </div>
    <div class="section-title">My projects</div>
    <div class="grid" id="cards"></div>
  </section>

  <!-- PROJECT -->
  <section id="project" class="view">
    <button class="back" onclick="go('')">← All projects</button>
    <div class="proj-head" id="head"></div>
    <div class="tabs" id="tabs"></div>
    <div id="tabcontent"></div>
  </section>
</main>

<footer>© NFG-DRMC — Fan projects, not affiliated with Mojang or Microsoft.</footer>

<script>
/* =====================================================================
   ✏️  EDIT ZONE: all the content of the site is here.
   ===================================================================== */

/* --- 1) YOUR PROJECTS -------------------------------------------------
   id        : identifier (no spaces, lowercase)
   name/tag  : title and small label
   color     : project color (hex)
   short     : sentence shown on the card
   lead      : intro text on the project page
   about     : description paragraphs
   features  : [ [title, text], ... ]
   downloads : [ [label, link], ... ]   (GitHub Release, Modrinth, CurseForge link…)
   screens   : list of image URLs (or files in your repo, e.g. "img/cst1.png")
   wiki      : true to show the "Crafting wiki" tab
   edition   : "java" or "bedrock" (used to filter the wiki)                  */
const PROJECTS = [
  {
    id:"cst-bedrock", name:"FNaF C'sT — Bedrock", tag:"Bedrock", color:"#ff3b3b", edition:"bedrock", wiki:true,
    short:"The FNaF mod for Minecraft Bedrock: animatronics, arcade cabinets and more.",
    lead:"The world of Five Nights at Freddy's inside Minecraft Bedrock.",
    about:[
      "Describe your project here: what it adds, the atmosphere, what makes it unique.",
      "You can write several paragraphs, they are displayed one under the other."
    ],
    features:[
      ["Animatronics","Replace this text with your real feature."],
      ["Arcade cabinets","Replace this text with your real feature."],
      ["Blocks & items","Replace this text with your real feature."]
    ],
    downloads:[["Download (.mcaddon)","#"]],
    screens:[]
  },
  {
    id:"cst-java", name:"FNaF C'sT — Java", tag:"Java", color:"#ff7a1a", edition:"java", wiki:true,
    short:"The FNaF mod for Minecraft Java Edition.",
    lead:"The world of Five Nights at Freddy's inside Minecraft Java.",
    about:[
      "Describe the Java version here: loader (Forge/Fabric/NeoForge), Minecraft version, new features."
    ],
    features:[
      ["Feature 1","Replace this text."],
      ["Feature 2","Replace this text."]
    ],
    downloads:[["Download (.jar)","#"]],
    screens:[]
  },
  {
    id:"drmc", name:"Drmc Additions", tag:"java", color:"#3bbcff", edition:"bedrock", wiki:false,
    short:"An additions addon for Minecraft Bedrock.",
    lead:"Additions to enrich your Bedrock world.",
    about:["Describe your Drmc Additions addon here."],
    features:[["Addition 1","Replace this text."],["Addition 2","Replace this text."]],
    downloads:[["Download (.mcaddon)","#"]],
    screens:[]
  },
  {
    id:"scp", name:"SCP: Restructured", tag:"java", color:"#9bff3b", edition:"java", wiki:false,
    short:"The Foundation, its anomalies and its containment zones.",
    lead:"A rework of the SCP universe in Minecraft.",
    about:["Describe SCP: Restructured here."],
    features:[["Entities","Replace this text."],["Containment zones","Replace this text."]],
    downloads:[["Download","#"]],
    screens:[]
  },
  {
    id:"oadm", name:"OADM", tag:"java", color:"#b36bff", edition:"java", wiki:false,
    short:"Discover OADM. A DELTARUNE project.",
    lead:"Presentation of the OADM project.",
    about:["Describe OADM here."],
    features:[["Highlight 1","Replace this text."]],
    downloads:[["Download","#"]],
    screens:[]
  },
  {
    id:"insomnia", name:"Insomnia", tag:"java", color:"#2de2c0", edition:"java", wiki:false,
    short:"Insomnia, a project for Minecraft Java Edition.",
    lead:"Presentation of the Insomnia project.",
    about:["Describe Insomnia here: what it adds, the atmosphere, the Minecraft version and loader."],
    features:[["Feature 1","Replace this text."],["Feature 2","Replace this text."]],
    downloads:[["Download (.jar)","#"]],
    screens:[]
  },
  {
    id:"pbs-northstar", name:"PBS: Northstar", tag:"Java", color:"#ffd23b", edition:"java", wiki:false,
    short:"PBS: Northstar, a project for Minecraft Java Edition.",
    lead:"Presentation of the PBS: Northstar project.",
    about:["Describe PBS: Northstar here: what it adds, the atmosphere, the Minecraft version and loader."],
    features:[["Feature 1","Replace this text."],["Feature 2","Replace this text."]],
    downloads:[["Download (.jar)","#"]],
    screens:[]
  }
];

/* --- 2) CRAFTING WIKI (C'sT) ------------------------------------------
   Each craft:
     name     : name of the resulting item
     cat      : category (used for the filters)
     editions : ["java"], ["bedrock"] or ["java","bedrock"]
     grid     : 9 slots (row by row). "" = empty slot.
     count    : quantity obtained
     desc     : short description
   ⚠️ The crafts below are EXAMPLES: replace them with the real ones. */
const CRAFTS = [
  { name:"Arcade Cabinet", cat:"Decoration", editions:["java","bedrock"], count:1,
    grid:["Iron","Iron","Iron", "Iron","Screen","Iron", "Iron","Redstone","Iron"],
    desc:"EXAMPLE — A playable arcade cabinet." },
  { name:"Example Item", cat:"Items", editions:["bedrock"], count:1,
    grid:["","Diamond","", "","Stick","", "","Stick",""],
    desc:"EXAMPLE — Replace with a real craft." },
  { name:"Example Block", cat:"Blocks", editions:["java"], count:4,
    grid:["Stone","Stone","", "Stone","Stone","", "","",""],
    desc:"EXAMPLE — Replace with a real craft." }
];

/* =====================================================================
   End of the edit zone.
   ===================================================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current=null, tab="about", wikiQuery="", wikiCat="All";

function go(id){ location.hash = id ? "#"+id : ""; }

function renderHome(){
  $("#cards").innerHTML = PROJECTS.map(p => `
    <button class="card" style="--c:${esc(p.color)}" onclick="go('${esc(p.id)}')">
      <span class="tag">${esc(p.tag)}</span>
      <h3>${esc(p.name)}</h3>
      <p>${esc(p.short)}</p>
      <span class="go">Open →</span>
    </button>`).join("");
}

function renderProject(){
  const p = current;
  document.documentElement.style.setProperty("--accent", p.color);
  $("#head").innerHTML = `<span class="tag">${esc(p.tag)}</span><h2>${esc(p.name)}</h2><p class="lead">${esc(p.lead)}</p>`;
  const tabs = [["about","Overview"]];
  if(p.wiki) tabs.push(["wiki","Crafting wiki"]);
  tabs.push(["dl","Downloads"]);
  $("#tabs").innerHTML = tabs.map(([k,l]) => `<button class="tab ${tab===k?'on':''}" onclick="setTab('${k}')">${l}</button>`).join("");
  renderTab();
}
function setTab(t){ tab=t; renderProject(); }

function renderTab(){
  const p=current, el=$("#tabcontent");
  if(tab==="about"){
    el.innerHTML = `
      <div class="box"><h4>About</h4>${p.about.map(t=>`<p style="margin-bottom:10px">${esc(t)}</p>`).join("")}</div>
      <div class="box"><h4>Features</h4><div class="feat">${p.features.map(([a,b])=>`<div><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join("")}</div></div>
      <div class="box"><h4>Screenshots</h4><div class="shots">${
        p.screens.length ? p.screens.map(u=>`<img loading="lazy" src="${esc(u)}" alt="Screenshot of ${esc(p.name)}">`).join("")
                         : `<div class="ph">Add your screenshots in screens</div><div class="ph">Add your screenshots in screens</div>`
      }</div></div>`;
  } else if(tab==="dl"){
    el.innerHTML = `<div class="box"><h4>Downloads</h4><div class="btns">${
      p.downloads.map(([l,u])=>`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">${esc(l)}</a>`).join("")
    }</div></div>`;
  } else if(tab==="wiki"){
    renderWiki();
  }
}

function renderWiki(){
  const p=current, el=$("#tabcontent");
  const list = CRAFTS.filter(c => c.editions.includes(p.edition));
  const cats = ["All", ...new Set(list.map(c=>c.cat))];
  el.innerHTML = `
    <div class="wiki-tools">
      <input id="q" type="search" placeholder="Search a craft…" value="${esc(wikiQuery)}" autocomplete="off">
    </div>
    <div class="chips" style="margin-bottom:18px">${cats.map(c=>`<button class="chip ${wikiCat===c?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <div class="crafts" id="craftlist"></div>`;
  $("#q").addEventListener("input", e => { wikiQuery=e.target.value; drawCrafts(list); });
  el.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => { wikiCat=b.dataset.cat; renderWiki(); }));
  drawCrafts(list);
}
function drawCrafts(list){
  const q = wikiQuery.trim().toLowerCase();
  const out = list.filter(c => (wikiCat==="All"||c.cat===wikiCat) && (!q || c.name.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q)));
  $("#craftlist").innerHTML = out.length ? out.map(c => `
    <article class="craft">
      <h5>${esc(c.name)}</h5><small>${esc(c.cat)}</small>
      <div class="recipe">
        <div class="g3">${c.grid.map(x=>`<div class="cell ${x?'':'e'}">${esc(x)}</div>`).join("")}</div>
        <span class="arrow">→</span>
        <div class="res">${esc(c.name)}${c.count>1?`<br>×${c.count}`:""}</div>
      </div>
      <p>${esc(c.desc)}</p>
    </article>`).join("") : `<div class="empty" style="grid-column:1/-1">No craft found.</div>`;
}

function route(){
  const id = decodeURIComponent(location.hash.slice(1));
  const p = PROJECTS.find(x => x.id===id);
  document.querySelectorAll(".view").forEach(v => v.classList.remove("on"));
  if(p){
    if(!current || current.id!==p.id){ tab="about"; wikiQuery=""; wikiCat="All"; }
    current=p; renderProject(); $("#project").classList.add("on");
    document.title = p.name + " — NFG-DRMC";
  } else {
    current=null;
    document.documentElement.style.setProperty("--accent", "#ff3b3b");
    $("#home").classList.add("on");
    document.title = "NFG-DRMC — Mods & Addons";
  }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
renderHome(); route();
</script>
</body>
</html>
